# ==========================================
# Công cụ Tự động Đăng ký ChatGPT - File cấu hình mẫu
# Hướng dẫn sử dụng:
# 1. Sao chép file này thành config.yaml
# 2. Chỉnh sửa cấu hình trong config.yaml
# ==========================================

# Cấu hình đăng ký
registration:
  total_accounts: 1      # Số lượng tài khoản đăng ký hàng loạt
  min_age: 20            # Tuổi tối thiểu cho ngày sinh ngẫu nhiên
  max_age: 40            # Tuổi tối đa cho ngày sinh ngẫu nhiên

# Dịch vụ Email tạm thời (Cloudflare Temp Email)
# Hướng dẫn triển khai: https://github.com/dreamhunter2333/cloudflare_temp_email
email:
  # Địa chỉ Cloudflare Worker (Bắt buộc phải sửa)
  worker_url: "https://your-worker-name.your-subdomain.workers.dev"

  # Tên miền tùy chỉnh của bạn (Bắt buộc phải sửa)
  domain: "your-custom-domain.com"

  # Độ dài tiền tố email
  prefix_length: 10

  # Cài đặt email xác thực
  wait_timeout: 120     # Thời gian chờ tối đa cho email xác thực (giây)
  poll_interval: 3      # Khoảng thời gian giữa các lần kiểm tra email (giây)

  # Mật khẩu truy cập Worker (Bắt buộc phải sửa)
  admin_password: "your-worker-admin-password"

# Cấu hình tự động hóa trình duyệt
browser:
  max_wait_time: 600    # Thời gian chờ tối đa toàn cục
  short_wait_time: 120  # Thời gian chờ cho tác vụ ngắn
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Quy tắc mật khẩu tài khoản
password:
  length: 16
  # Bộ ký tự mật khẩu (gồm chữ hoa, chữ thường và số)
  charset: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"

# Chiến lược thử lại khi gặp lỗi
retry:
  http_max_retries: 5       # Số lần thử lại tối đa cho yêu cầu HTTP
  http_timeout: 30          # Thời gian chờ tối đa của yêu cầu HTTP
  error_page_max_retries: 5 # Số lần thử lại tối đa khi gặp trang lỗi
  button_click_max_retries: 3 # Số lần thử lại tối đa khi nhấn nút

# Khoảng cách giữa các lần đăng ký hàng loạt
batch:
  interval_min: 5  # Khoảng cách tối thiểu (giây)
  interval_max: 15 # Khoảng cách tối đa (giây)

# Thông tin thanh toán (dùng để tự động đăng ký dùng thử Plus)
# Cảnh báo: Không điền thông tin thẻ tín dụng thật vào file này, trừ khi file không được chia sẻ công khai
payment:
  credit_card:
    number: "YOUR_CREDIT_CARD_NUMBER" # Số thẻ tín dụng
    expiry: "MMYY"                    # Ngày hết hạn (định dạng MMYY, ví dụ: 1225)
    expiry_month: "12"                # Tháng hết hạn
    expiry_year: "2025"               # Năm hết hạn
    cvc: "123"                        # Mã bảo mật

# Cấu hình đường dẫn file
files:
  accounts_file: "registered_accounts.txt"  # Đường dẫn lưu các tài khoản đã đăng ký thành công
